name: Publish FORGE to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: forge-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate source assets
        run: |
          set -e
          test -f index.html
          test -f forge-extras.css
          test -f forge-extras.js
          test -f forge-polish.css
          test -f forge-polish.js
          test -f forge-integrations.js
          test -f manifest.webmanifest
          test -f sw.js
          test -f icon.svg
          node --check forge-extras.js
          node --check forge-polish.js
          node --check forge-integrations.js
          node --check sw.js
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html','utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!match) throw new Error('Main inline app script missing');
          new vm.Script(match[1]);
          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(x=>x[1]);
          if (new Set(ids).size !== ids.length) throw new Error('Duplicate element ids');
          const endBaseStyle=html.indexOf('</style>');
          const extrasLink=html.indexOf('href="./forge-extras.css"');
          const polishLink=html.indexOf('href="./forge-polish.css"');
          if (!(endBaseStyle>0 && extrasLink>endBaseStyle && polishLink>extrasLink))
            throw new Error('Feature stylesheets must load AFTER the inline CSS to prevent mobile nav regression');
          const tabs=[...html.matchAll(/<button\b[^>]*class="tab(?: active)?"[^>]*data-view="([^"]+)"/g)].map(x=>x[1]);
          if (tabs.length!==4 || new Set(tabs).size!==4)
            throw new Error('Expected exactly four navigation tabs');
          const polish=fs.readFileSync('forge-polish.css','utf8');
          const integrations=fs.readFileSync('forge-integrations.js','utf8');
          // Walking completion must never create a second source of actual steps.
          for(const id of ['forgeFinishWalking','forgeStepWeekBars','forgeStepWeekAvg',
                           'forgeStepWeekGoal','forgeStepWeekCount']){
            if(!ids.includes(id))throw new Error('Post-walking or history element missing: '+id);
          }
          if(!match[1].includes("$('#forgeFinishWalking').addEventListener('click'")
             || !match[1].includes("$('#forgeGoSteps')"))
             throw new Error('Walking completion must link to the canonical Today input');
          if(!match[1].includes("const stored=storage.get('fitness-planner-'+key,null)"))
             throw new Error('Seven-day step chart must read dated actual step records');
          if(!match[1].includes("renderStepWeek();"))
             throw new Error('Seven-day chart must rerender when steps change');

          // Walking must share the actual step count saved by Today, not count old
          // standalone Walking preferences as completed steps.
          for (const id of ['walkingDone','walkingRemaining','walkingProgressTrack',
                            'walkModeRemaining','walkModeCustom','walkingModeHint']) {
            if (!ids.includes(id)) throw new Error('Today/Walking sync widget missing: '+id);
          }
          if (!match[1].includes("storage.get('fitness-planner-'+dateKey")
              || !match[1].includes("$('#plannerSteps').addEventListener('input',updateWalking)"))
            throw new Error('Walking must update from Today’s dated step record');
          if (!match[1].includes('const total=Math.round(done+steps+other)'))
            throw new Error('Walking summary must combine actual with future steps only once');
          if (!match[1].includes("if(!auto){next.steps=steps;next.other=other;}"))
            throw new Error('Automatic Walking mode must preserve saved custom plan preferences');
          // A single visible step entry point avoids conflicting, duplicate inputs.
          if (!/<input id="forgeStepInput" type="number"/.test(html))
            throw new Error('Simple visible step entry missing from Today');
          if (!/<input id="forgeQuickSteps" type="hidden"/.test(html)
              || !/<input id="plannerSteps" type="hidden"/.test(html))
            throw new Error('Legacy step fields must remain available but hidden');
          if (!/<details class="planner forge-collapsible-planner"/.test(html))
            throw new Error('Advanced walking planner must be optional');
          for (const id of ['forgeSnapSteps','forgeSnapLeft','forgeStepProgress','forgeStepSave','forgeStepFeedback']) {
            if (!ids.includes(id)) throw new Error('Step widget missing: '+id);
          }
          const stepModule=fs.readFileSync('forge-polish.js','utf8');
          if (!stepModule.includes("$('#forgeSaveSteps').click()"))
            throw new Error('Step entry must use the existing persistence path');
          for(const id of [...integrations.matchAll(/\$\('#([A-Za-z0-9_-]+)'\)/g)].map(m=>m[1])){
            if(!ids.includes(id))throw new Error('Missing integration element: '+id);
          }
          if (!/grid-template-columns:repeat\(4,minmax\(0,1fr\)\)/.test(polish))
            throw new Error('Mobile navigation must use four equal columns');
          const nav=html.slice(html.indexOf('<nav class="tabs"'),html.indexOf('</nav>')+6);
          if (!nav.includes('grid-template-columns:repeat(4,minmax(0,1fr))'))
            throw new Error('Nav must retain an inline four-column fallback');
          const fixedIcons=[...nav.matchAll(/<svg style="[^"]*width:19px;height:19px;[^"]*" viewBox=/g)];
          if (fixedIcons.length!==4)
            throw new Error('Each navigation SVG must have a fixed 19px inline size');
          if (!/height:67px;max-height:67px;min-height:67px/.test(html))
            throw new Error('Mobile toolbar requires a compact built-in height fallback');
          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          if (manifest.display !== 'standalone') throw new Error('PWA manifest missing standalone');
          NODE
      - name: Ensure GitHub Pages uses workflow publishing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MODE="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null || true)"
          echo "Pages source: ${MODE:-unknown}"
          if [ "$MODE" != "workflow" ]; then
            if ! gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow >/dev/null; then
              echo '::warning::Workflow token cannot update Pages settings. Make sure Settings → Pages → Source is GitHub Actions. Continuing to configure-pages to avoid blocking permitted deployments.'
            fi
            echo 'Pages source updated to GitHub Actions.'
          fi
      - name: Create static site bundle
        run: |
          mkdir -p site
          cp index.html forge-extras.css forge-extras.js forge-polish.css forge-polish.js forge-integrations.js manifest.webmanifest sw.js icon.svg site/
          touch site/.nojekyll
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const version=html.match(/<meta name="application-version" content="([^"]+)"/)?.[1] || 'unknown';
          const info={app:'FORGE',version,commit:process.env.GITHUB_SHA,builtAt:new Date().toISOString()};
          fs.writeFileSync('site/build-info.json',JSON.stringify(info,null,2));
          console.log('Publishing',info);
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public deployment
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          TARGET="${SITE_URL%/}/build-info.json?run=$GITHUB_RUN_ID"
          for attempt in 1 2 3 4 5 6; do
            BODY="$(curl --silent --show-error --location --max-time 12 "$TARGET" || true)"
            if printf '%s' "$BODY" | grep -Fq "$GITHUB_SHA"; then
              echo "Public website verified: $GITHUB_SHA"
              exit 0
            fi
            echo "Waiting for the public Pages build ($attempt/6)"
            sleep 5
          done
          echo '::warning::GitHub accepted the Pages deploy but live build identification could not be confirmed yet.'
